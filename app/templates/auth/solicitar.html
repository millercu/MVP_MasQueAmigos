{% extends "base.html" %}
{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<section class="auth-page auth-page-compact container py-4 py-md-5">
    <div class="auth-card auth-card-compact">
        <div class="auth-header">
            <div class="auth-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555ZM0 4.697v7.104l5.803-3.558L0 4.697ZM6.761 8.83.074 12.93A2 2 0 0 0 2 14h12a2 2 0 0 0 1.926-1.07L9.239 8.83 8 9.586 6.761 8.83Zm3.436-.587L16 11.801V4.697l-5.803 3.546Z"/>
                </svg>
            </div>
            <span class="auth-kicker">RECUPERACIÓN DE ACCESO</span>
            <h2>Recuperar Contraseña</h2>
            <p>Ingresa el correo con el que te registraste. Te enviaremos un enlace seguro para restablecer el acceso.</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="auth-field">
                <label class="form-label" for="solicitar-email">Correo Electrónico</label>
                <input id="solicitar-email" type="email" name="email" class="form-control" required placeholder="nombre@correo.com">
            </div>
            <button type="submit" class="btn btn-primario auth-submit w-100">Enviar Enlace</button>
        </form>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Restablecer Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-3">Crear Nueva Contraseña</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nueva Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                    <div class="form-text text-muted small">Mínimo 8 caracteres, 1 mayúscula, 1 número y 1 carácter especial.</div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Guardar Contraseña</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
